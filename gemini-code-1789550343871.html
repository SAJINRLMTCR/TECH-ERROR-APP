<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Universal Error & Online Lookup Tool</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuse.js for local fuzzy search -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <!-- Tesseract.js for Photo OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-10 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                <span>⚡</span> Universal Tech Fixer
            </h1>
            <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1 rounded-full font-mono">
                Online Sync Enabled
            </span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

        <!-- Controls -->
        <section class="bg-slate-800 rounded-xl p-4 sm:p-6 border border-slate-700 shadow-lg space-y-4">
            
            <!-- Search & OCR Row -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <label for="searchInput" class="block text-sm font-medium text-slate-300 mb-2">
                        Enter Error Code, BSOD Name, or Symptom
                    </label>
                    <input type="text" id="searchInput" placeholder="e.g. 0x00000709, WHEA_UNCORRECTABLE_ERROR, 0x80070005..." 
                        class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Scan Screen / Photo</label>
                    <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden" onchange="processImage(event)">
                    <button onclick="document.getElementById('imageInput').click()" 
                        class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 py-3 rounded-lg text-sm font-medium transition flex items-center justify-center gap-2">
                        📷 Photo / OCR Scan
                    </button>
                    <span id="ocrStatus" class="text-xs text-amber-400 font-mono hidden mt-1 block">Extracting text...</span>
                </div>
            </div>

            <!-- Categories -->
            <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-700">
                <button onclick="setFilter('ALL')" id="btn-ALL" class="filter-btn bg-blue-600 text-white text-xs sm:text-sm px-4 py-2 rounded-lg font-medium">All Local</button>
                <button onclick="setFilter('Printer')" id="btn-Printer" class="filter-btn bg-slate-700 text-slate-300 hover:bg-slate-600 text-xs sm:text-sm px-4 py-2 rounded-lg font-medium">🖨️ Printer Sharing</button>
                <button onclick="setFilter('Network')" id="btn-Network" class="filter-btn bg-slate-700 text-slate-300 hover:bg-slate-600 text-xs sm:text-sm px-4 py-2 rounded-lg font-medium">🌐 Network & RDP</button>
                <button onclick="setFilter('BSOD')" id="btn-BSOD" class="filter-btn bg-slate-700 text-slate-300 hover:bg-slate-600 text-xs sm:text-sm px-4 py-2 rounded-lg font-medium">💻 BSOD</button>
            </div>
        </section>

        <!-- Results Container -->
        <section id="resultsContainer" class="space-y-4"></section>

    </main>

    <script>
        // 1. LOCAL QUICK DATABASE
        const errorDatabase = [
            { code: "0x00000709", category: "Printer", title: "Cannot Set Default Printer / Share Error", cause: "Registry permissions locked on HKCU or Print Spooler service failure.", solutions: ["Open `regedit` -> `HKCU\\Software\\Microsoft\\Windows NT\\CurrentVersion\\Windows`", "Grant Full Control permissions to your account.", "Run cmd as admin: `net stop spooler && net start spooler`"] },
            { code: "0x0000011b", category: "Printer", title: "RPC Auth Privacy Error on Print Server Share", cause: "Windows Update patch enforcing RPC privacy requirements.", solutions: ["Open regedit on Host Server -> `HKLM\\SYSTEM\\CurrentControlSet\\Control\\Print`", "Create DWORD (32-bit): `RpcAuthnLevelPrivacyEnabled` set to `0`", "Restart Spooler on host PC."] },
            { code: "WHEA_UNCORRECTABLE_ERROR", category: "BSOD", title: "Hardware / Voltage Fault (0x00000124)", cause: "Physical hardware failure, unstable CPU overclocking, or thermal throttling.", solutions: ["Reset BIOS to optimized defaults.", "Reseat RAM modules and GPU.", "Inspect CPU temperatures and clean dust/thermal paste."] },
            { code: "0x80070035", category: "Network", title: "The Network Path Was Not Found", cause: "SMB1 disabled, Network Discovery turned off, or NetBIOS settings issue.", solutions: ["Enable Network Discovery & File/Printer Sharing.", "Set services `Function Discovery Resource Publication` to Automatic.", "Enable NetBIOS over TCP/IP in IPv4 adapter properties."] }
        ];

        let fuse;
        let currentFilter = 'ALL';
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');

        function initSearchEngine() {
            fuse = new Fuse(errorDatabase, { keys: ['code', 'title', 'cause', 'category'], threshold: 0.4 });
            render();
        }

        function setFilter(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-slate-700', 'text-slate-300');
            });
            const activeBtn = document.getElementById(`btn-${category}`);
            if(activeBtn) {
                activeBtn.classList.remove('bg-slate-700', 'text-slate-300');
                activeBtn.classList.add('bg-blue-600', 'text-white');
            }
            render();
        }

        function render() {
            const query = searchInput.value.trim();
            let results = (query === "") ? errorDatabase : fuse.search(query).map(res => res.item);

            if (currentFilter !== 'ALL') {
                results = results.filter(item => item.category === currentFilter);
            }

            // IF NO LOCAL MATCH: SHOW ONLINE LOOKUP TRIGGER
            if (results.length === 0 && query !== "") {
                resultsContainer.innerHTML = `
                    <div class="bg-slate-800 rounded-xl p-8 border border-slate-700 text-center space-y-4">
                        <div class="text-amber-400 text-3xl">🔍</div>
                        <div>
                            <p class="text-lg font-bold text-white">"${query}" not found in local offline database.</p>
                            <p class="text-sm text-slate-400">Search online technical databases directly:</p>
                        </div>
                        
                        <div class="flex flex-wrap justify-center gap-3 pt-2">
                            <button onclick="searchOnline('msdn', '${encodeURIComponent(query)}')" 
                                class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2.5 rounded-lg transition flex items-center gap-2">
                                🌐 Search Microsoft Documentation
                            </button>
                            <button onclick="searchOnline('google', '${encodeURIComponent(query)}')" 
                                class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium px-4 py-2.5 rounded-lg transition flex items-center gap-2">
                                🔎 Search All IT Technical Forums
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            resultsContainer.innerHTML = results.map(item => `
                <article class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-md space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
                        <h2 class="text-lg font-bold text-blue-400 font-mono">${item.code} <span class="text-white font-sans text-base"> - ${item.title}</span></h2>
                        <span class="text-xs px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-300">${item.category}</span>
                    </div>
                    <div>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-0.5">Root Cause</span>
                        <p class="text-slate-300 text-sm leading-relaxed">${item.cause}</p>
                    </div>
                    <div>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Technician Repair Steps</span>
                        <ul class="list-disc list-inside space-y-1 text-slate-200 text-sm">
                            ${item.solutions.map(step => `<li>${formatStep(step)}</li>`).join('')}
                        </ul>
                    </div>
                </article>
            `).join('');
        }

        function formatStep(text) {
            return text.replace(/`([^`]+)`/g, '<code class="bg-slate-900 text-amber-400 px-1.5 py-0.5 rounded text-xs font-mono border border-slate-700">$1</code>');
        }

        // 2. ONLINE SEARCH ROUTER
        function searchOnline(provider, query) {
            let url = "";
            if (provider === 'msdn') {
                url = `https://learn.microsoft.com/en-us/search/?terms=${query}`;
            } else if (provider === 'google') {
                url = `https://www.google.com/search?q=${query}+fix+solution+error+code`;
            }
            window.open(url, '_blank');
        }

        // 3. OCR PROCESSOR
        async function processImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const ocrStatus = document.getElementById('ocrStatus');
            ocrStatus.classList.remove('hidden');
            ocrStatus.innerText = "Processing image...";

            try {
                const worker = await Tesseract.createWorker('eng');
                const ret = await worker.recognize(file);
                await worker.terminate();
                ocrStatus.innerText = "Text extracted!";
                
                // Clean input and assign
                searchInput.value = ret.data.text.trim();
                render();
            } catch (err) {
                ocrStatus.innerText = "OCR failed. Type code manually.";
            }
        }

        searchInput.addEventListener('input', render);
        initSearchEngine();
    </script>
</body>
</html>
